name: PR issue-link validation

# #738: every PR must reference an open issue. Prevents issue-less,
# self-directed PRs (2026-08-29 incident class). Passes when either:
#   - branch name matches feat/<issue-number>-... or fix/<issue-number>-..., or
#   - title or body references #<n> / Fixes #<n> / Closes #<n>
#     and that issue exists and is open at review time.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write  # to comment on failure

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR references an open issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;

            const fail = async (msg) => {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: pr.number,
                body: `**pr-issue-link gate:** ❌ ${msg}\n\nEvery PR must reference an open issue. Either name the branch \`feat/<issue#>-<slug>\` /\`fix/<issue#>-<slug>\`, or reference \`#<issue>\` / \`Fixes #<issue>\` in the title or description (see issue #738).`,
              });
              core.setFailed(msg);
            };

            // 1) branch-name form: feat/123-slug, fix/123-slug
            const branchMatch = headRef.match(/^(?:feat|fix|chore|docs)\/(\d+)-/);
            if (branchMatch) {
              const n = parseInt(branchMatch[1], 10);
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: n });
                if (issue.data.state === 'open' && !issue.data.pull_request) {
                  core.info(`Branch references open issue #${n}`);
                  return;
                }
                return fail(`Branch references #${n}, but it is ${issue.data.state}${issue.data.pull_request ? ' (a PR, not an issue)' : ''}.`);
              } catch (e) {
                return fail(`Branch references #${n}, which does not exist.`);
              }
            }

            // 2) title/body reference form
            const text = `${pr.title}\n${pr.body || ''}`;
            const refs = [...text.matchAll(/(?:fixes|closes|resolves|refs?)\s+#(\d+)/gi)].map(m => parseInt(m[1], 10));
            if (refs.length === 0) {
              return fail('No issue reference found in branch name, title, or description.');
            }
            for (const n of refs) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: n });
                if (issue.data.state === 'open' && !issue.data.pull_request) return core.info(`References open issue #${n}`);
              } catch { /* try next */ }
            }
            return fail(`Referenced issue(s) ${refs.join(', ')} are not open issues.`);
